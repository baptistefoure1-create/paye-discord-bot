name: Unpack Pillbox bot

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/unpack-pillbox.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack bot at repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'EMS_Discord_Paie_Bot_V0_2_8_NORTHFLANK_24_7*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No matching ZIP found."
            exit 1
          fi
          rm -rf /tmp/pillbox-unpack
          mkdir -p /tmp/pillbox-unpack
          unzip -q "$ZIP_FILE" -d /tmp/pillbox-unpack
          test -f /tmp/pillbox-unpack/ems_bot_v028_northflank/Dockerfile
          cp -a /tmp/pillbox-unpack/ems_bot_v028_northflank/. .
          rm -f ./EMS_Discord_Paie_Bot_V0_2_8_NORTHFLANK_24_7*.zip
          rm -f .github/workflows/unpack-pillbox.yml

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajout complet V0.2.8 Northflank"
          git push
