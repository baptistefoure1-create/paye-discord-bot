name: Apply and test V0.2.9

on:
  push:
    branches:
      - v0.2.9-improvements

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v0.2.9-improvements
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V0.2.9 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_v029.py')
          text = path.read_text(encoding='utf-8')

          old_helper = "out, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new_helper = "repl = replacement if callable(replacement) else (lambda _: replacement)\n    out, count = re.subn(pattern, repl, text, count=1, flags=flags)"
          if old_helper not in text:
              raise SystemExit('Correctif sub_once introuvable')
          text = text.replace(old_helper, new_helper, 1)

          old_behavior = '    r"\\1" + behavior_handler,'
          new_behavior = '    lambda m: m.group(1) + behavior_handler,'
          if old_behavior not in text:
              raise SystemExit('Capture behavior handler introuvable')
          text = text.replace(old_behavior, new_behavior, 1)

          lines = text.splitlines()
          replaced_final = False
          for i, line in enumerate(lines):
              if 'r"\\1\\n        await syncPendingGradeRoles' in line:
                  lines[i] = '    lambda m: m.group(1) + "\\n        await syncPendingGradeRoles(interaction.guild, session).catch(() => null);\\n        await syncWarningRoles(interaction.guild, session).catch(() => null);",'
                  replaced_final = True
                  break
          if not replaced_final:
              raise SystemExit('Capture final role sync introuvable')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 scripts/apply_v029.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: |
          node --check src/index.js
          node --check src/services/matchingService.js
          node --check src/services/warningService.js
          node --check src/services/discordRoleService.js
          node --check src/services/txtGenerator.js

      - name: Run tests
        run: npm test

      - name: Commit tested V0.2.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_v029.py .github/workflows/apply-v029.yml
          git add -A
          git commit -m "V0.2.9 - étape 3 rapide, avertissements et rôles Discord"
          git push origin v0.2.9-improvements
